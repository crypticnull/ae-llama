name: Build ZXP

on:
  workflow_dispatch:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # feed branch pushes + release attachments
    env:
      UPDATES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check panel JavaScript
        shell: pwsh
        run: |
          $files = Get-ChildItem extension/js -Recurse -Filter *.js
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($f.Name)" }
          }
          Write-Host "OK: $($files.Count) files"

      - name: Run host-tool tests (stubbed AE object model)
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests -Filter test-*.js
          foreach ($t in $tests) {
            node $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($t.Name)" }
          }

      - name: Download ZXPSignCmd
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $urls = @(
            'https://github.com/Adobe-CEP/CEP-Resources/raw/master/ZXPSignCMD/4.1.2/win64/ZXPSignCmd.exe',
            'https://github.com/Adobe-CEP/CEP-Resources/raw/master/ZXPSignCMD/4.1.1/win64/ZXPSignCmd.exe'
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile tools/ZXPSignCmd.exe -UseBasicParsing
              break
            } catch { Write-Warning "Failed: $u" }
          }
          if (-not (Test-Path tools/ZXPSignCmd.exe)) { throw 'Could not download ZXPSignCmd' }

      # Optional stable signing identity: set repo secrets ZXP_CERT_B64
      # (base64 of a .p12) and ZXP_CERT_PASSWORD. Without them each build
      # signs with a fresh self-signed cert, which installs fine via the
      # aescripts ZXP Installer but changes identity per build.
      - name: Restore signing certificate (optional)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.ZXP_CERT_B64 }}
        run: |
          if ($env:CERT_B64) {
            [IO.File]::WriteAllBytes("$PWD/signing.p12",
              [Convert]::FromBase64String($env:CERT_B64))
            "CERT_FILE=$PWD/signing.p12" >> $env:GITHUB_ENV
            Write-Host 'Using certificate from repo secret.'
          } else {
            Write-Host 'No ZXP_CERT_B64 secret - using a per-build self-signed cert.'
          }

      - name: Build signed ZXP
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
        run: |
          $params = @{ ZxpSignCmd = "$PWD/tools/ZXPSignCmd.exe" }
          if ($env:CERT_FILE) {
            $params.CertFile = $env:CERT_FILE
            $params.CertPassword = $env:CERT_PASSWORD
          }
          .\scripts\package-zxp.ps1 @params

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AE-Llama-zxp
          path: dist/*.zxp
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Get-Content -Raw extension/CSXS/manifest.xml
          if ($m -notmatch 'ExtensionBundleVersion="([\d\.]+)"') { throw 'no version in manifest' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Stage the signed ZXP + a filled-in update.json on the private repo's
      # 'feed' branch. The public updates repo (which installed panels poll)
      # is synced from here -- automatically below when UPDATES_REPO_TOKEN is
      # set, otherwise by whoever cuts the release.
      - name: Stage update feed (feed branch)
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          git config user.name 'ci'
          git config user.email 'ci@users.noreply.github.com'
          git fetch origin feed 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add ../feedwt origin/feed
          } else {
            git worktree add --detach ../feedwt
            Push-Location ../feedwt
            git checkout --orphan feed
            git rm -rf -q . 2>$null
            Pop-Location
          }
          Get-ChildItem ../feedwt -Exclude .git | Remove-Item -Recurse -Force
          Copy-Item dist/*.zxp ../feedwt/
          # Stable filename so the raw CDN path is always warm (new per-version
          # paths can 404 for minutes after a push); the ?v= cache-buster in
          # the URL forces a fresh fetch per version.
          Copy-Item dist/*.zxp ../feedwt/AE-Llama.zxp
          $feed = Get-Content -Raw update.json | ConvertFrom-Json
          $feed.panelVersion = $ver
          $feed.panelPackageUrl = "https://raw.githubusercontent.com/crypticnull/ae-llama-updates/main/AE-Llama.zxp?v=$ver"
          # Real release notes ride in release-notes.txt at the repo root
          # (the update banner shows them to every panel); without one the
          # version string is the note, as before.
          $notes = "AE Llama $ver"
          if (Test-Path release-notes.txt) {
            $notes = (Get-Content -Raw release-notes.txt).Trim()
          }
          $feed.notes = $notes
          $feed | ConvertTo-Json -Depth 8 | Set-Content ../feedwt/update.json -Encoding UTF8
          Push-Location ../feedwt
          git add -A
          git commit -m "feed: AE Llama $ver"
          git push origin HEAD:feed --force
          Pop-Location

      # Fully hands-off public sync: create a fine-grained PAT with
      # contents:write on crypticnull/ae-llama-updates and save it as the
      # UPDATES_REPO_TOKEN secret. Without it this step is skipped and the
      # feed branch above is mirrored manually.
      - name: Sync public updates repo
        if: env.UPDATES_TOKEN != ''
        shell: pwsh
        run: |
          git clone "https://x-access-token:$env:UPDATES_TOKEN@github.com/crypticnull/ae-llama-updates.git" ../pub
          Get-ChildItem ../pub -Exclude .git | Remove-Item -Recurse -Force
          Copy-Item ../feedwt/* ../pub/ -Recurse
          Push-Location ../pub
          git config user.name 'ci'
          git config user.email 'ci@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "AE Llama ${{ steps.ver.outputs.version }}"; git push }
          Pop-Location

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zxp
          generate_release_notes: true
