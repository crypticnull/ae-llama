<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>AE Llama</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="status">
        <span id="status-dot" class="dot off"></span>
        <span id="status-text">Server stopped</span>
      </div>
      <div id="topbar-buttons">
        <button id="btn-settings" title="Settings">&#9881;</button>
        <button id="btn-logs" title="Server log">&#9636;</button>
      </div>
    </header>

    <section id="model-row">
      <select id="model-select" title="Model file (.gguf)">
        <option value="">Loading models&hellip;</option>
      </select>
      <button id="btn-refresh-models" title="Rescan models folder">&#8635;</button>
      <button id="btn-server-toggle" class="primary" title="Start / stop llama-server">Start</button>
    </section>

    <section id="starter-row" class="hidden">
      <select id="starter-select" title="Curated models sized to your GPU"></select>
      <button id="btn-get-model" class="primary">Download</button>
    </section>

    <section id="progress-row" class="hidden">
      <div id="progress-info">
        <span id="progress-label"></span>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>
      <button id="btn-progress-cancel" class="danger" title="Cancel download">&#10005;</button>
    </section>

    <section id="settings-drawer" class="drawer hidden">
      <h3>Updates</h3>
      <p id="version-line" class="fineprint"></p>
      <label class="check">
        <input id="set-auto-update" type="checkbox"/>
        <span>Install panel updates automatically</span>
      </label>
      <div class="drawer-actions" style="justify-content: flex-start;">
        <button id="btn-check-updates">Check for updates</button>
        <button id="btn-update-panel">Update panel now</button>
        <button id="btn-update-engine">Reinstall / update engine</button>
      </div>

      <h3>Settings</h3>

      <label>Models folder
        <div class="pathfield">
          <input id="set-models-dir" type="text" spellcheck="false"/>
          <button id="btn-browse-models-dir">&hellip;</button>
        </div>
      </label>

      <label class="check">
        <input id="set-dryrun" type="checkbox"/>
        <span>Dry run (show commands, don't apply)</span>
      </label>

      <div class="drawer-actions" style="justify-content: flex-start;">
        <button id="btn-advanced-toggle">Advanced &#9656;</button>
      </div>

      <div id="advanced-settings" class="hidden">
        <label>llama-server.exe
          <div class="pathfield">
            <input id="set-server-path" type="text" spellcheck="false"/>
            <button id="btn-browse-server">&hellip;</button>
          </div>
        </label>

        <div class="grid2">
          <label>Port
            <input id="set-port" type="number" min="1024" max="65535"/>
          </label>
          <label>Context size
            <input id="set-ctx" type="number" min="512" step="512"/>
          </label>
          <label>GPU layers (-ngl)
            <input id="set-ngl" type="number" min="0" max="999"/>
          </label>
          <label>Temperature
            <input id="set-temp" type="number" min="0" max="2" step="0.1"/>
          </label>
          <label>Max tool rounds
            <input id="set-rounds" type="number" min="1" max="8"/>
          </label>
        </div>
      </div>

      <h3>ComfyUI (image / video generation)</h3>

      <label>Instance URL
        <input id="set-comfy-url" type="text" spellcheck="false"
               placeholder="http://127.0.0.1:8188"/>
      </label>

      <label>Install folder (for Launch button)
        <div class="pathfield">
          <input id="set-comfy-dir" type="text" spellcheck="false"/>
          <button id="btn-browse-comfy-dir">&hellip;</button>
        </div>
      </label>

      <label>Workflow templates folder (API-format .json)
        <div class="pathfield">
          <input id="set-comfy-workflows" type="text" spellcheck="false"/>
          <button id="btn-browse-comfy-workflows">&hellip;</button>
        </div>
      </label>

      <label>Generated files folder
        <div class="pathfield">
          <input id="set-comfy-out" type="text" spellcheck="false"/>
          <button id="btn-browse-comfy-out">&hellip;</button>
        </div>
      </label>

      <div class="grid2">
        <label>Generation timeout (s)
          <input id="set-comfy-timeout" type="number" min="30" step="30"/>
        </label>
      </div>

      <div class="drawer-actions">
        <button id="btn-comfy-launch">Launch ComfyUI</button>
        <button id="btn-comfy-test">Test connection</button>
        <button id="btn-settings-close">Close</button>
      </div>

      <h3>Models</h3>
      <p class="fineprint">Curated GGUF models sized to your GPU; the best
        fit for your VRAM is preselected. Downloads go to the models folder.</p>
      <div class="pathfield">
        <select id="set-model-select"></select>
        <button id="btn-get-model-settings">Download</button>
      </div>

    </section>

    <section id="log-drawer" class="drawer hidden">
      <h3>Server log</h3>
      <pre id="log-output"></pre>
      <div class="drawer-actions">
        <button id="btn-log-clear">Clear</button>
        <button id="btn-log-close">Close</button>
      </div>
    </section>

    <main id="chat"></main>

    <footer id="composer">
      <textarea id="chat-input" rows="2"
        placeholder="Ask the model to do something in After Effects&hellip;"></textarea>
      <div id="composer-buttons">
        <button id="btn-send" class="primary" title="Send (Enter)">Send</button>
        <button id="btn-clear-chat" title="Clear conversation">Clear</button>
      </div>
    </footer>

  </div>

  <script src="js/libs/cep-bridge.js"></script>
  <script src="js/version.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/llama.js"></script>
  <script src="js/comfy.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
